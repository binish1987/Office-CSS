<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-SYS Reflect ID Lookup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 40px 24px;
    }
    h1 { font-size: 1.3rem; color: #e8610a; margin-bottom: 6px; }
    h1 span { color: #e6edf3; font-weight: 400; }
    .sub { color: #8b949e; font-size: .85rem; margin-bottom: 28px; }

    .key-row {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .key-row label { color: #8b949e; font-size: .82rem; white-space: nowrap; }
    .key-row input {
      flex: 1; min-width: 260px;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 6px; color: #e6edf3;
      font-family: monospace; font-size: .82rem;
      padding: 8px 12px; outline: none;
    }
    .key-row input:focus { border-color: #e8610a; }

    button#fetch-btn {
      background: #e8610a; border: none; border-radius: 6px;
      color: #fff; font-size: .95rem; font-weight: 600;
      padding: 10px 28px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background .15s;
    }
    button#fetch-btn:hover { background: #c04e00; }
    button#fetch-btn:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status { margin: 16px 0; font-size: .85rem; color: #8b949e; min-height: 20px; }
    #status.err { color: #f85149; }
    #status.ok  { color: #3fb950; }

    table {
      width: 100%; border-collapse: collapse;
      background: #161b22; border-radius: 8px;
      overflow: hidden; font-size: .88rem;
      display: none;
    }
    thead { background: #21262d; }
    th {
      text-align: left; padding: 12px 16px;
      color: #8b949e; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid #30363d;
    }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid #21262d;
      word-break: break-all;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }

    .id-val {
      font-family: monospace; font-size: .82rem;
      color: #79c0ff; background: #0d1117;
      padding: 2px 8px; border-radius: 4px;
      display: inline-block;
    }
    .copy-id {
      background: none; border: 1px solid #30363d;
      border-radius: 4px; color: #8b949e;
      font-size: .72rem; padding: 2px 7px;
      cursor: pointer; margin-left: 6px;
    }
    .copy-id:hover { border-color: #e8610a; color: #e6edf3; }

    .raw-wrap {
      margin-top: 24px;
    }
    .raw-wrap summary {
      cursor: pointer; color: #8b949e; font-size: .82rem;
      margin-bottom: 8px; user-select: none;
    }
    pre#raw {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 6px; padding: 14px;
      font-size: .78rem; overflow: auto;
      max-height: 340px; white-space: pre-wrap;
      word-break: break-word; line-height: 1.6;
    }
    .jk { color: #79c0ff; }
    .js { color: #3fb950; }
    .jn { color: #d2a8ff; }
    .jb { color: #e3b341; }
  </style>
</head>
<body>

<h1>Q-SYS <span>Reflect — ID Lookup</span></h1>
<p class="sub">Fetch Site ID, Core ID and System ID from your organisation.</p>

<div class="key-row">
  <label>API Key</label>
  <input type="password" id="api-key"
         value="d3f4d5bff1e0c6be40a7f05530ab68dd89591be66ca5e92b8fa48ab656941482"
         autocomplete="off" spellcheck="false" />
</div>

<button id="fetch-btn">
  <div class="spinner" id="spinner"></div>
  <span id="btn-label">Fetch IDs</span>
</button>

<div id="status"></div>

<table id="results-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Core ID</th>
      <th>Site ID</th>
      <th>System ID</th>
    </tr>
  </thead>
  <tbody id="results-body"></tbody>
</table>

<details class="raw-wrap" id="raw-wrap" style="display:none">
  <summary>Raw JSON response</summary>
  <pre id="raw"></pre>
</details>

<script>
  const REFLECT_API = 'https://reflect.qsc.com/api/public/v0';
  const PROXY       = 'https://corsproxy.io/?url=';

  const keyInput = document.getElementById('api-key');
  const saved    = localStorage.getItem('reflect_api_key');
  if (saved) keyInput.value = saved;
  keyInput.addEventListener('input', () =>
    localStorage.setItem('reflect_api_key', keyInput.value.trim()));

  function proxyUrl(path) {
    return PROXY + encodeURIComponent(REFLECT_API + path);
  }

  function highlight(json) {
    return json
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(
        /("(\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g,
        m => {
          if (/^"/.test(m)) return /:$/.test(m) ? `<span class="jk">${m}</span>` : `<span class="js">${m}</span>`;
          if (/true|false|null/.test(m)) return `<span class="jb">${m}</span>`;
          return `<span class="jn">${m}</span>`;
        }
      );
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = 'Copy'), 1500);
    });
  }

  function idCell(val) {
    if (!val) return '<td><span style="color:#8b949e">—</span></td>';
    return `<td>
      <span class="id-val">${val}</span>
      <button class="copy-id" onclick="copyText('${val}', this)">Copy</button>
    </td>`;
  }

  document.getElementById('fetch-btn').addEventListener('click', async () => {
    const apiKey = keyInput.value.trim();
    if (!apiKey) { setStatus('Please enter your API key.', 'err'); return; }

    setStatus('Fetching from /cores …', '');
    setBusy(true);

    const headers = {
      'Authorization': `Bearer ${apiKey}`,
      'Accept': 'application/json',
    };

    try {
      const res  = await fetch(proxyUrl('/cores'), { headers });
      const text = await res.text();
      let data;

      try { data = JSON.parse(text); } catch {
        setStatus('Invalid response from API — check your API key.', 'err');
        setBusy(false);
        return;
      }

      if (!res.ok) {
        const msg = data?.message || data?.error || res.statusText;
        setStatus(`API error ${res.status}: ${msg}`, 'err');
        setBusy(false);
        showRaw(text);
        return;
      }

      // API may return array or { data: [...] }
      const items = Array.isArray(data) ? data : (data.data ?? data.cores ?? data.items ?? [data]);

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      if (items.length === 0) {
        setStatus('No cores found in this organisation.', 'ok');
      } else {
        items.forEach(item => {
          const name     = item.name || item.displayName || item.hostname || '(unnamed)';
          const coreId   = item.coreId   || item.id          || item.coreID   || '';
          const siteId   = item.siteId   || item.site_id     || item.siteID   || '';
          const systemId = item.systemId || item.system_id   || item.systemID || '';

          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${name}</td>${idCell(coreId)}${idCell(siteId)}${idCell(systemId)}`;
          tbody.appendChild(tr);
        });

        setStatus(`Found ${items.length} core(s).`, 'ok');
        document.getElementById('results-table').style.display = 'table';
      }

      showRaw(text);
    } catch (err) {
      setStatus(`Network error: ${err.message}`, 'err');
    }

    setBusy(false);
  });

  function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls;
  }

  function setBusy(on) {
    const btn = document.getElementById('fetch-btn');
    btn.disabled = on;
    document.getElementById('spinner').style.display = on ? 'inline-block' : 'none';
    document.getElementById('btn-label').textContent = on ? 'Fetching…' : 'Fetch IDs';
  }

  function showRaw(text) {
    try {
      document.getElementById('raw').innerHTML =
        highlight(JSON.stringify(JSON.parse(text), null, 2));
    } catch {
      document.getElementById('raw').textContent = text;
    }
    document.getElementById('raw-wrap').style.display = '';
  }
</script>
</body>
</html>
